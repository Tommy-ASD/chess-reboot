<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FEN Renderer</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>

<body>
  <header id="page-header">
    <h1>FEN Renderer</h1>
    <nav id="page-nav">
      <!-- Local | Online mode split (plan: multiplayer). "Local" is the
           original hotseat board; "Online" reveals the lobby + live games. -->
      <div id="mode-tabs" class="mode-tabs" role="tablist">
        <button id="tab-local" class="mode-tab active" role="tab" aria-selected="true">Local</button>
        <button id="tab-online" class="mode-tab" role="tab" aria-selected="false">Online</button>
      </div>
      <a id="open-editor-nav" href="/editor.html">Open Editor &rarr;</a>
    </nav>
  </header>

  <!-- Play Online surface (hidden in Local mode). Holds the lobby
       (identity + create/join/public list) and, once seated, the active
       game panel (players, turn, share link, resign / leave). -->
  <section id="online-panel" class="online-panel hidden" aria-label="Play online">
    <div id="online-lobby">
      <div class="online-identity">
        <label for="player-name">Display name</label>
        <input id="player-name" type="text" placeholder="Anonymous" maxlength="24" autocomplete="off" />
      </div>

      <div class="online-columns">
        <div class="online-card">
          <h3>Create game</h3>
          <label class="field">Name
            <input id="create-name" type="text" placeholder="optional" maxlength="40" autocomplete="off" />
          </label>
          <label class="field">Position
            <select id="create-preset">
              <option value="standard">Standard chess</option>
              <option value="duck">Duck Chess</option>
            </select>
          </label>
          <label class="field">Play as
            <select id="create-color">
              <option value="White">White</option>
              <option value="Black">Black</option>
            </select>
          </label>
          <label class="checkbox">
            <input id="create-public" type="checkbox" /> List in public lobby
          </label>
          <button id="create-btn">Create game</button>
        </div>

        <div class="online-card">
          <h3>Join by code</h3>
          <label class="field">
            <input id="join-code" type="text" placeholder="e.g. A1B2C3" maxlength="12" autocomplete="off" />
          </label>
          <button id="join-btn">Join game</button>
        </div>

        <div class="online-card">
          <h3>Public games</h3>
          <ul id="public-games" class="public-games"></ul>
          <p id="public-games-empty" class="muted-note">No open games right now — create one!</p>
        </div>
      </div>
    </div>

    <div id="online-game" class="hidden">
      <div class="players-row">
        <span class="player-chip" id="chip-white"><span class="dot white"></span><span class="chip-name">White</span></span>
        <span class="turn-pill" id="turn-pill">Waiting…</span>
        <span class="player-chip" id="chip-black"><span class="dot black"></span><span class="chip-name">Black</span></span>
      </div>
      <div class="game-meta">
        <span id="conn-status" class="conn-status" title="Live"></span>
        <span id="share-line" class="share-line"></span>
        <button id="copy-link-btn" class="ghost-btn">Copy link</button>
      </div>

      <div class="move-history-wrap">
        <h3>Moves</h3>
        <ol id="move-history" class="move-history"></ol>
      </div>
      <div class="game-actions">
        <button id="flip-btn" class="ghost-btn">⇅ Flip</button>
        <button id="rematch-btn" class="primary-btn hidden">Rematch</button>
        <button id="goto-rematch-btn" class="primary-btn hidden">Go to rematch &rarr;</button>
        <button id="resign-btn" class="danger-btn">Resign</button>
        <button id="leave-btn" class="ghost-btn">Back to lobby</button>
      </div>
    </div>
  </section>

  <!-- Game-status banner (plans 04/06): hidden while Ongoing; shows
       check + the terminal outcomes (checkmate / stalemate / brainrot). -->
  <div id="game-status" class="game-status hidden" role="status" aria-live="polite"></div>

  <!-- Promotion picker (plan 03 core moves): shown when a pawn reaches the
       back rank; pick Q/R/B/N to submit the chosen promotion. -->
  <div id="promotion-picker" class="promotion-picker hidden" role="dialog" aria-label="Choose promotion piece"></div>

  <!-- Duck-placement hint (plan 11): shown during the Duck Chess duck
       half-turn; empty squares are highlighted as placement targets. -->
  <div id="duck-hint" class="duck-hint hidden" role="status" aria-live="polite"></div>

  <div id="layout">
    <div id="left-panel">
      <input id="fen-input" type="text" placeholder="Enter FEN here" />
      <button id="load-btn">Load FEN</button>

      <h3>FEN Presets</h3>
      <ul id="fen-list"></ul>

      <div class="board-size-control">
        <label for="board-size-slider">
          Board size <span id="board-size-value" class="board-size-value">532px</span>
        </label>
        <input id="board-size-slider" type="range" />
      </div>

      <button id="flip-local-btn" class="ghost-btn flip-local">⇅ Flip board</button>

      <a id="open-editor-link" href="/editor.html">Edit this position &rarr;</a>
    </div>

    <div id="board"></div>

    <div id="actions-panel">
      <h3>Actions</h3>
      <div id="special-actions"></div>
    </div>

    <div id="carrier-panel">
      <h3>Carrier</h3>
      <div id="carrier-moves"></div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
