[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.7", features = ["macros", "ws"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

engine = { path = "../engine" }
tower-http = { version = "0.6.8", features = ["cors"] }
http = "1.4.0"
